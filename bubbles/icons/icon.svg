      <path d="M-.78 -.18 A.8 .8 0 0 1 -.5 -.64" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width=".07" stroke-linecap="round"/>
      <path d="M.75 .28 A.8 .8 0 0 1 .4 .7" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width=".055" stroke-linecap="round"/>
      <circle r=".985" fill="none" stroke="#fff" stroke-opacity=".85" stroke-width=".03"/>
