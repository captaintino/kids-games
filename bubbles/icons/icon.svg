<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a5cff"/>
      <stop offset=".55" stop-color="#b06bff"/>
      <stop offset="1" stop-color="#ff8fd6"/>
    </linearGradient>
    <radialGradient id="pink" cx=".42" cy=".38" r=".62">
      <stop offset="0" stop-color="#fff0fa" stop-opacity=".75"/>
      <stop offset=".45" stop-color="#ff7fd0" stop-opacity=".75"/>
      <stop offset=".85" stop-color="#ff2fa6"/>
      <stop offset="1" stop-color="#c8007a"/>
    </radialGradient>
    <radialGradient id="blue" cx=".42" cy=".38" r=".62">
      <stop offset="0" stop-color="#effcff" stop-opacity=".75"/>
      <stop offset=".45" stop-color="#6fd6ff" stop-opacity=".75"/>
      <stop offset=".85" stop-color="#2f8cff"/>
      <stop offset="1" stop-color="#1550c0"/>
    </radialGradient>
    <radialGradient id="yellow" cx=".42" cy=".38" r=".62">
      <stop offset="0" stop-color="#fffdee" stop-opacity=".8"/>
      <stop offset=".45" stop-color="#ffe46b" stop-opacity=".8"/>
      <stop offset=".85" stop-color="#ffb21f"/>
      <stop offset="1" stop-color="#d97800"/>
    </radialGradient>
    <radialGradient id="hl" cx=".5" cy=".5" r=".5">
