  <rect width="512" height="512" fill="url(#bg)"/>
  <g fill="#fff">
    <circle cx="96" cy="110" r="7" opacity=".8"/>
    <circle cx="420" cy="90" r="5" opacity=".7"/>
    <circle cx="430" cy="300" r="6" opacity=".6"/>
