<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Shape &amp; Color Sorter</title>
  <meta name="description" content="Drag toy shapes into their holes and fruit into the right color basket. Every shape and color is said out loud.">
  <meta name="theme-color" content="#ff9a2e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Play Party">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <link rel="preload" href="../shared/fonts/fredoka-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../shared/css/kit.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <section id="screen-title" class="screen active" data-start>
    <button class="round-btn corner-left" data-action="hub" aria-label="All games">🏠</button>
    <button class="round-btn corner-right" data-action="sound" aria-label="Toggle sound">🔊</button>
    <div class="panel">
      <h1 class="logo"><span>Shape &amp;</span><span>Color</span><span>Sorter</span></h1>
      <div class="title-toys" id="title-toys" aria-hidden="true"></div>
      <div class="btn-col">
        <button class="btn btn-orange mode-btn" data-action="mode" data-mode="shapes">
          <span class="mode-ico" id="ico-shapes"></span> Shapes
        </button>
        <button class="btn btn-green mode-btn" data-action="mode" data-mode="colors">
          <span class="mode-ico" id="ico-colors"></span> Colors
        </button>
      </div>
      <div class="best-line" id="title-best"></div>
    </div>
  </section>

  <div id="play" class="play hidden">
    <div id="board" class="board"></div>
    <div id="tray" class="tray"></div>
    <div id="targets" class="layer"></div>
    <div id="pieces" class="layer"></div>
    <div class="hud">
      <button class="round-btn" data-action="back" aria-label="Back">⬅️</button>
      <div class="pill progress" id="progress"></div>
      <button class="round-btn" data-action="sound" aria-label="Toggle sound">🔊</button>
    </div>
  </div>

  <div id="probe" class="probe" aria-hidden="true"></div>

  <script type="module" src="js/main.js"></script>
  <script nomodule>
    document.body.insertAdjacentHTML('beforeend',
      '<p style="position:fixed;left:0;right:0;top:40%;padding:20px;text-align:center;font:600 22px sans-serif;color:#fff">' +
      'Sorry! This browser is too old for this game. Please update it to play.</p>');
  </script>
</body>
</html>
