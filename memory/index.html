<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Memory Match</title>
  <meta name="description" content="Flip the cards and find the pairs! A memory game with cute pictures for little kids, from 3 to 8 pairs. Works offline.">
  <meta name="theme-color" content="#3d9bff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Play Party">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <link rel="preload" href="../shared/fonts/fredoka-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../shared/css/kit.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Title screen -->
  <section id="screen-title" class="screen active" data-start>
    <button class="round-btn corner-left" data-action="hub" aria-label="All games">🏠</button>
    <button class="round-btn corner-right" data-action="sound" aria-label="Toggle sound">🔊</button>
    <div class="panel title-panel">
      <div class="hero" id="hero" aria-hidden="true"></div>
      <h1 class="logo"><span>Memory</span><span>Match</span></h1>
      <div class="btn-col">
        <button class="btn btn-pink" data-action="play"><span class="btn-icon">▶️</span> Play</button>
        <button class="btn btn-blue" data-action="levels"><span class="btn-icon">🃏</span> Levels</button>
      </div>
      <div class="best-line" id="title-best"></div>
    </div>
  </section>

  <!-- Level picker -->
  <section id="screen-levels" class="screen">
    <div class="panel levels-panel">
      <div class="levels-head">
        <button class="round-btn" data-action="home" aria-label="Back">⬅️</button>
        <h2 class="heading">How many cards?</h2>
        <button class="round-btn" data-action="sound" aria-label="Toggle sound">🔊</button>
      </div>
      <div class="level-grid" id="level-grid"></div>
    </div>
  </section>

  <!-- Play area (not a .screen: shown while no screen is active) -->
  <div id="play" class="play hidden">
    <div id="area" class="area" aria-hidden="true"></div>
    <div id="table" class="table"></div>
    <div class="hud">
      <button class="round-btn" data-action="back" aria-label="Back">⬅️</button>
      <div class="pill pips" id="pips"></div>
      <button class="round-btn" data-action="sound" aria-label="Toggle sound">🔊</button>
    </div>
  </div>

  <!-- You found them all! -->
  <section id="screen-win" class="screen dim">
    <div class="panel card win-card">
      <h2 class="heading" id="win-title">You did it!</h2>
      <div class="result-stars" id="win-stars"><span class="rstar">★</span><span class="rstar">★</span><span class="rstar">★</span></div>
      <div class="win-pics" id="win-pics"></div>
      <div class="btn-col">
        <button class="btn btn-green btn-next" data-action="next"><span class="autofill" id="autofill"></span><span class="btn-icon">➡️</span> Next</button>
        <button class="btn btn-orange btn-small" data-action="again"><span class="btn-icon">🔁</span> Again</button>
      </div>
    </div>
  </section>

  <script type="module" src="js/main.js"></script>
  <script nomodule>
    document.body.insertAdjacentHTML('beforeend',
      '<p style="position:fixed;left:0;right:0;top:40%;padding:20px;text-align:center;font:600 22px sans-serif;color:#fff">' +
      'Sorry! This browser is too old for this game. Please update it to play.</p>');
  </script>
</body>
</html>
