<!doctype html><html><body style="background:#3a8fd0;margin:0">
<div id="out" style="display:flex;flex-wrap:wrap"></div>
<script type="module">
import { SPECIES, buildArt, portrait } from './js/fish.js';
const out = document.getElementById('out');
for (const sp of SPECIES) {
  const a = buildArt(sp, 2);
  const p = portrait(a, 200, false, false);
  p.style.cssText = 'width:200px;height:150px;background:rgba(255,255,255,.15);margin:4px';
  out.appendChild(p);
}
for (const sp of SPECIES.slice(0,4)) {
  const a = buildArt(sp, 2);
  const p = portrait(a, 200, true, false); p.style.cssText='width:200px;height:150px;margin:4px'; out.appendChild(p);
  const q = portrait(a, 200, false, true); q.style.cssText='width:200px;height:150px;margin:4px'; out.appendChild(q);
}
</script></body></html>
