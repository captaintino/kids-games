<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Animal Sounds</title>
  <meta name="description" content="Tap the animals to hear them moo, oink and quack, then find who says what.">
  <meta name="theme-color" content="#5cc8ff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Play Party">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <link rel="preload" href="../shared/fonts/fredoka-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../shared/css/kit.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Title -->
  <section id="screen-title" class="screen active" data-start>
    <button class="round-btn corner-left" data-action="hub" aria-label="All games">🏠</button>
    <button class="round-btn corner-right" data-action="sound" aria-label="Toggle sound">🔊</button>
    <div class="panel title-panel">
      <div class="parade" id="parade"></div>
      <h1 class="logo"><span>Animal</span><span>Sounds</span></h1>
      <div class="tagline">Moo! Oink! Quack!</div>
      <div class="btn-col">
        <button class="btn btn-pink" data-action="play"><span class="btn-icon">🐮</span> Tap &amp; Hear</button>
        <button class="btn btn-blue" data-action="quiz"><span class="btn-icon">❓</span> Who Says…?</button>
      </div>
      <div class="best-line" id="title-stars"></div>
    </div>
  </section>

  <!-- Tap & Hear -->
  <div id="play" class="mode-area">
    <div class="hud">
      <button class="round-btn" data-action="back" aria-label="Back">⬅️</button>
      <div class="pill">🎵 Tap!</div>
      <button class="round-btn" data-action="quiz" aria-label="Who says?">❓</button>
      <button class="round-btn" data-action="sound" aria-label="Toggle sound">🔊</button>
    </div>
    <div class="barn" id="barn"></div>
  </div>

  <!-- Who says...? -->
  <div id="quiz" class="mode-area">
    <div class="hud">
      <button class="round-btn" data-action="back" aria-label="Back">⬅️</button>
      <div class="pill star-pill" id="star-pill">⭐ 0</div>
      <button class="round-btn" data-action="sound" aria-label="Toggle sound">🔊</button>
    </div>
    <div class="question" id="question">
      <button class="replay" data-action="replay" data-quiet aria-label="Hear it again">🔊</button>
      <div class="q-text" id="q-text">Who says <b>MOO</b>?</div>
    </div>
    <div class="choices" id="choices"></div>
  </div>

  <script type="module" src="js/main.js"></script>
  <script nomodule>
    document.body.insertAdjacentHTML('beforeend',
      '<p style="position:fixed;left:0;right:0;top:40%;padding:20px;text-align:center;font:600 22px sans-serif;color:#fff">' +
      'Sorry! This browser is too old for this game. Please update it to play.</p>');
  </script>
</body>
</html>
