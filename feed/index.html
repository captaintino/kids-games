<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Feed the Animal</title>
  <meta name="description" content="Drag yummy food to a hungry friend! They munch what they love and make silly faces at broccoli.">
  <meta name="theme-color" content="#5cd65c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Play Party">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <link rel="preload" href="../shared/fonts/fredoka-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../shared/css/kit.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <section id="screen-title" class="screen active" data-start>
    <button class="round-btn corner-left" data-action="hub" aria-label="All games">🏠</button>
    <button class="round-btn corner-right" data-action="sound" aria-label="Toggle sound">🔊</button>
    <div class="panel title-panel">
      <h1 class="logo"><span>Feed the</span><span>Animal!</span></h1>
      <div class="title-pals" id="title-pals" aria-hidden="true"></div>
      <div class="btn-col">
        <button class="btn btn-pink" data-action="pick"><span class="btn-icon">🍽️</span> Play</button>
        <button class="btn btn-blue" data-action="surprise"><span class="btn-icon">🎲</span> Surprise!</button>
      </div>
      <div class="best-line" id="title-best"></div>
    </div>
  </section>

  <section id="screen-pick" class="screen">
    <button class="round-btn corner-left" data-action="home" aria-label="Back">⬅️</button>
    <button class="round-btn corner-right" data-action="sound" aria-label="Toggle sound">🔊</button>
    <div class="panel pick-panel">
      <h2 class="heading">Who's hungry?</h2>
      <div class="pal-grid" id="pal-grid"></div>
    </div>
  </section>

  <div id="play" class="play hidden">
    <div id="friend" class="friend-box"><div class="fb"><div class="fa" id="fa"></div></div></div>
    <div id="tray" class="tray"></div>
    <div id="pieces" class="layer"></div>
    <div id="floaters" class="layer"></div>
    <div class="hud">
      <button class="round-btn" data-action="leave" aria-label="Back">⬅️</button>
      <div class="pill meter" id="meter" aria-label="Tummy">
        <span class="m-ico" id="m-ico"></span>
        <div class="m-bar" id="m-bar"></div>
      </div>
      <button class="round-btn" data-action="sound" aria-label="Toggle sound">🔊</button>
    </div>
  </div>

  <section id="screen-nap" class="screen nap-screen">
    <div class="nap-card card">
      <div class="btn-col">
        <button class="btn btn-pink" data-action="friends"><span class="btn-icon">🐾</span> New friend</button>
        <button class="btn btn-green btn-small" data-action="again"><span class="btn-icon">🔁</span> Again</button>
      </div>
    </div>
  </section>

  <div id="probe" class="probe" aria-hidden="true"></div>

  <script type="module" src="js/main.js"></script>
  <script nomodule>
    document.body.insertAdjacentHTML('beforeend',
      '<p style="position:fixed;left:0;right:0;top:40%;padding:20px;text-align:center;font:600 22px sans-serif;color:#fff">' +
      'Sorry! This browser is too old for this game. Please update it to play.</p>');
  </script>
</body>
</html>
